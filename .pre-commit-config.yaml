# Optional but recommended: `pip install pre-commit && pre-commit install`
repos:
  # clang-format is pinned so every machine and CI format identically: bump `rev` deliberately and reformat everything
  # with `scripts/format.sh` in the same commit
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        # generated from src/rbe by the single-header hook below
        exclude: ^single_include/

  - repo: local
    hooks:
      # single_include/rbe/rbe.hpp is generated from src/rbe: regenerate it and stage it, so the commit includes it
      - id: single-header
        name: regenerate the single header
        entry: bash -c 'python3 scripts/amalgamate.py && git add single_include/rbe/rbe.hpp'
        language: system
        files: ^(src/rbe/.*\.hpp|src/CMakeLists\.txt|scripts/amalgamate\.py)$
        pass_filenames: false
